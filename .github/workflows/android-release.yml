name: Android (publicar versión)

# Se ejecuta al subir una etiqueta «android-vX.Y.Z»: compila los APK, calcula sus sumas de verificación y crea el
# lanzamiento en GitHub con las notas de docs/versiones/android-X.Y.Z.md.
on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew
      - name: Versión a partir de la etiqueta
        run: echo "VERSION=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
      - name: Pruebas y lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - name: APK de depuración y optimizado (R8)
        run: ./gradlew assembleDebug assembleMinificado --stacktrace
      - name: Preparar archivos
        run: |
          mkdir -p ../salida
          cp app/build/outputs/apk/minificado/app-minificado.apk "../salida/kiwu-android-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "../salida/kiwu-android-${VERSION}-debug.apk"
          cd ../salida && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Kiwu para Android ${{ env.VERSION }}
          body_path: docs/versiones/android-${{ env.VERSION }}.md
          prerelease: true
          files: |
            salida/*.apk
            salida/SHA256SUMS.txt
