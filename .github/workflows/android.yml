name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "docs/contrato/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "docs/contrato/**", ".github/workflows/android.yml"]

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew
      - name: Pruebas, lint y APK de depuración
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kiwu-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
