name: Android

on:
  push:
    branches: [main]
    paths: ["app/src/**", "docs/contrato/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/src/**", "docs/contrato/**", ".github/workflows/android.yml"]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew
      - name: Crear local.properties para CI
        run: touch local.properties
      - name: Pruebas, lint y APK de depuraciÃ³n
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kiwu-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
